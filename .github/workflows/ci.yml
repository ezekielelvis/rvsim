name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: C++ core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: make core-test

  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: make go-build
      - name: Test
        run: make go-test
      - name: Vet and staticcheck
        run: make lint
      - name: Boundary benchmark
        run: make bench

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: C++ unit tests (sanitized)
        run: make sanitize
      - name: Go tests against sanitized core
        run: make go-asan

  compliance:
    name: riscv-tests, ACT4 + Spike difftest
    runs-on: ubuntu-24.04
    env:
      RVSIM_REQUIRE_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cache pinned Spike, Sail and GCC
        uses: actions/cache@v4
        with:
          path: ~/.cache/rvsim-tools
          key: spike-${{ runner.os }}-${{ hashFiles('scripts/toolchain.sh') }}
      - name: Install toolchains, Spike and Sail
        run: |
          scripts/toolchain.sh --install
          echo "$HOME/.cache/rvsim-tools/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compliance
        run: make compliance
      - name: Difftest against Spike
        run: make difftest
      - name: Cache ACT4 ELFs
        id: act4-cache
        uses: actions/cache@v4
        with:
          path: build/archtest/rvsim-rv64imac/elfs
          key: act4-${{ runner.os }}-${{ hashFiles('tests/archtest/rvsim-rv64imac/**', 'tests/archtest/build-archtest.sh') }}
      - name: Generate ACT4 ELFs
        if: steps.act4-cache.outputs.cache-hit != 'true'
        run: make archtest-elfs
      - name: Architecture tests (ACT4)
        run: make archtest
